<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151828"/>
      <stop offset="100%" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="cabBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3040"/>
      <stop offset="100%" stop-color="#1c2028"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="520" fill="url(#bg)"/>

  <!-- Cabinet outline -->
  <rect x="30" y="20" width="340" height="440" rx="6" fill="url(#cabBody)" stroke="#4a5a6a" stroke-width="2"/>
  <rect x="40" y="30" width="320" height="420" rx="3" fill="#1a1e28" stroke="#3a4a5a" stroke-width="1"/>

  <!-- Header -->
  <rect x="40" y="30" width="320" height="26" rx="2" fill="#0d1018" stroke="#3a4a5a" stroke-width="0.8"/>
  <text x="200" y="46" fill="#f5c400" font-size="10" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">CONTACTOR CABINET</text>
  <text x="200" y="55" fill="#7a8fa8" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">NEMA 3R · 277/480V 3-Phase</text>

  <!-- ===== MAIN BREAKER ===== -->
  <text x="50" y="72" fill="#f5c400" font-size="8" font-family="Arial,sans-serif" font-weight="600">MAIN BREAKER</text>
  <rect x="45" y="78" width="130" height="36" rx="3" fill="#1a2028" stroke="#5a6a7a" stroke-width="1.5"/>
  <rect x="50" y="82" width="120" height="28" rx="2" fill="#2a2222" stroke="#e05a2b" stroke-width="1.2"/>
  <text x="110" y="98" fill="#e05a2b" font-size="9" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">400A MAIN</text>

  <!-- Incoming power label -->
  <text x="220" y="88" fill="#7a8fa8" font-size="7" font-family="Arial,sans-serif">Incoming</text>
  <text x="220" y="98" fill="#7a8fa8" font-size="7" font-family="Arial,sans-serif">Utility Feed</text>
  <path d="M270 95 L310 95 L310 85 L325 95 L310 105 L310 95" fill="none" stroke="#7a8fa8" stroke-width="1.2"/>

  <!-- Bus bar -->
  <rect x="45" y="118" width="310" height="10" rx="1" fill="#3a2a1a" stroke="#a88800" stroke-width="1"/>
  <text x="200" y="126" fill="#a88800" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">DISTRIBUTION BUS</text>

  <!-- ===== CONTACTORS ===== -->
  <text x="50" y="148" fill="#f5c400" font-size="8" font-family="Arial,sans-serif" font-weight="600">LIGHTING CONTACTORS</text>

  <!-- Contactor 1 -->
  <rect x="45" y="154" width="145" height="44" rx="3" fill="#1a2228" stroke="#5a6a7a" stroke-width="1.2"/>
  <text x="117" y="170" fill="#7ab8ff" font-size="8" text-anchor="middle" font-family="Arial,sans-serif" font-weight="600">Contactor 1</text>
  <text x="117" y="182" fill="#6a8aaa" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">Circuit A · Poles 1-4</text>
  <text x="117" y="191" fill="#6a8aaa" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">48A Full Load</text>
  <rect x="50" y="156" width="8" height="6" rx="1" fill="#3aaa6e"/>

  <!-- Contactor 2 -->
  <rect x="210" y="154" width="145" height="44" rx="3" fill="#1a2228" stroke="#5a6a7a" stroke-width="1.2"/>
  <text x="282" y="170" fill="#7ab8ff" font-size="8" text-anchor="middle" font-family="Arial,sans-serif" font-weight="600">Contactor 2</text>
  <text x="282" y="182" fill="#6a8aaa" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">Circuit B · Poles 5-8</text>
  <text x="282" y="191" fill="#6a8aaa" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">48A Full Load</text>
  <rect x="215" y="156" width="8" height="6" rx="1" fill="#3aaa6e"/>

  <!-- Contactor 3 -->
  <rect x="45" y="202" width="145" height="44" rx="3" fill="#1a2228" stroke="#5a6a7a" stroke-width="1.2"/>
  <text x="117" y="218" fill="#7ab8ff" font-size="8" text-anchor="middle" font-family="Arial,sans-serif" font-weight="600">Contactor 3</text>
  <text x="117" y="230" fill="#6a8aaa" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">Circuit C · Poles 9-12</text>
  <text x="117" y="239" fill="#6a8aaa" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">48A Full Load</text>

  <!-- Contactor 4 -->
  <rect x="210" y="202" width="145" height="44" rx="3" fill="#1a2228" stroke="#5a6a7a" stroke-width="1.2"/>
  <text x="282" y="218" fill="#7ab8ff" font-size="8" text-anchor="middle" font-family="Arial,sans-serif" font-weight="600">Contactor 4</text>
  <text x="282" y="230" fill="#6a8aaa" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">Circuit D · Poles 13-16</text>
  <text x="282" y="239" fill="#6a8aaa" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">48A Full Load</text>

  <!-- Divider -->
  <line x1="45" y1="256" x2="355" y2="256" stroke="#3a4a5a" stroke-width="1" opacity="0.5"/>

  <!-- ===== CONTROL TRANSFORMER ===== -->
  <text x="50" y="272" fill="#f5c400" font-size="8" font-family="Arial,sans-serif" font-weight="600">CONTROL POWER</text>
  <rect x="45" y="278" width="130" height="36" rx="3" fill="#1a2028" stroke="#5a6a7a" stroke-width="1.5"/>
  <text x="110" y="296" fill="#ff8844" font-size="8" text-anchor="middle" font-family="Arial,sans-serif">Transformer 277V → 24V</text>
  <text x="110" y="306" fill="#6a8aaa" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">Control power — always on</text>

  <!-- ===== SPD ===== -->
  <text x="210" y="272" fill="#f5c400" font-size="8" font-family="Arial,sans-serif" font-weight="600">SURGE PROTECTION</text>
  <rect x="210" y="278" width="145" height="36" rx="3" fill="#1a2028" stroke="#5a6a7a" stroke-width="1.5"/>
  <text x="282" y="296" fill="#7ab8ff" font-size="8" text-anchor="middle" font-family="Arial,sans-serif">SPD</text>
  <text x="282" y="306" fill="#6a8aaa" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">Surge Protection Device</text>
  <circle cx="340" cy="287" r="3" fill="#3aaa6e"/>

  <!-- ===== CIRCUIT BREAKERS ===== -->
  <line x1="45" y1="322" x2="355" y2="322" stroke="#3a4a5a" stroke-width="1" opacity="0.5"/>
  <text x="50" y="338" fill="#f5c400" font-size="8" font-family="Arial,sans-serif" font-weight="600">INDIVIDUAL CIRCUIT BREAKERS</text>

  <rect x="45" y="344" width="60" height="28" rx="2" fill="#1a2028" stroke="#e05a2b" stroke-width="1"/>
  <text x="75" y="360" fill="#e05a2b" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">CB-A 50A</text>

  <rect x="110" y="344" width="60" height="28" rx="2" fill="#1a2028" stroke="#e05a2b" stroke-width="1"/>
  <text x="140" y="360" fill="#e05a2b" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">CB-B 50A</text>

  <rect x="175" y="344" width="60" height="28" rx="2" fill="#1a2028" stroke="#e05a2b" stroke-width="1"/>
  <text x="205" y="360" fill="#e05a2b" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">CB-C 50A</text>

  <rect x="240" y="344" width="60" height="28" rx="2" fill="#1a2028" stroke="#e05a2b" stroke-width="1"/>
  <text x="270" y="360" fill="#e05a2b" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">CB-D 50A</text>

  <!-- ===== CONTROL-LINK BOARD ===== -->
  <line x1="45" y1="380" x2="355" y2="380" stroke="#3a4a5a" stroke-width="1" opacity="0.5"/>
  <text x="50" y="396" fill="#f5c400" font-size="8" font-family="Arial,sans-serif" font-weight="600">CONTROL-LINK BOARD</text>
  <rect x="45" y="402" width="310" height="30" rx="3" fill="#1a2028" stroke="#4a6a8a" stroke-width="1.2"/>
  <text x="200" y="416" fill="#7ab8ff" font-size="8" text-anchor="middle" font-family="Arial,sans-serif">Remote Monitoring & Control Interface</text>
  <text x="200" y="426" fill="#6a8aaa" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">Connected to Control-Link Central</text>

  <!-- Terminal strips -->
  <text x="50" y="446" fill="#6a8aaa" font-size="6" font-family="Arial,sans-serif">Terminal: L1  N  G</text>

  <!-- Bottom label -->
  <text x="200" y="510" fill="#f5c400" font-size="11" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">Contactor Cabinet Layout (tap to zoom)</text>
</svg>
