<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" width="440" height="500">
  <rect width="440" height="500" fill="#f5f0e8"/>
  <text x="220" y="30" fill="#222" font-size="15" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">Contactor Cabinet Layout</text>
  <text x="220" y="46" fill="#666" font-size="11" text-anchor="middle" font-family="Arial,sans-serif">Mounted at grade · Serves multiple poles/circuits</text>

  <!-- Cabinet outline -->
  <rect x="20" y="60" width="400" height="400" rx="5" fill="#e8dcc8" stroke="#8a7a6a" stroke-width="2"/>
  <rect x="30" y="70" width="380" height="380" rx="3" fill="#faf5ee" stroke="#c4b8a8" stroke-width="1.5"/>

  <!-- ===== 1. MAIN BREAKER ===== -->
  <g transform="translate(35, 75)">
    <text x="0" y="12" fill="#222" font-size="11" font-weight="700" font-family="Arial,sans-serif">1. MAIN BREAKER</text>
    <rect x="0" y="18" width="160" height="38" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="5" y="22" width="150" height="30" rx="2" fill="#3a2020" stroke="#e05a2b" stroke-width="2"/>
    <text x="80" y="42" fill="#e05a2b" font-size="12" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">400A MAIN</text>

    <!-- Incoming feed arrow -->
    <text x="175" y="32" fill="#666" font-size="9" font-family="Arial,sans-serif">Incoming utility feed</text>
    <path d="M265 36 L305 36 L305 26 L320 36 L305 46 L305 36" fill="none" stroke="#888" stroke-width="1.5"/>
  </g>

  <!-- ===== DISTRIBUTION BUS ===== -->
  <g transform="translate(35, 118)">
    <rect x="0" y="0" width="370" height="10" rx="1" fill="#d4c8a8" stroke="#a88800" stroke-width="1.5"/>
    <text x="185" y="8" fill="#8a7a40" font-size="8" text-anchor="middle" font-family="Arial,sans-serif">DISTRIBUTION BUS</text>
  </g>

  <!-- ===== 2. CONTACTORS ===== -->
  <g transform="translate(35, 134)">
    <text x="0" y="12" fill="#222" font-size="11" font-weight="700" font-family="Arial,sans-serif">2. LIGHTING CONTACTORS</text>

    <!-- Contactor 1 -->
    <rect x="0" y="18" width="175" height="44" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="0" y="18" width="175" height="16" rx="3" fill="#3a4048"/>
    <text x="87" y="30" fill="#f5c400" font-size="9" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">Contactor 1</text>
    <text x="10" y="48" fill="#222" font-size="8" font-family="Arial,sans-serif">Circuit A · Poles 1-4</text>
    <text x="10" y="58" fill="#666" font-size="8" font-family="Arial,sans-serif">48A Full Load</text>
    <circle cx="165" cy="26" r="4" fill="#3aaa6e"/>

    <!-- Contactor 2 -->
    <rect x="185" y="18" width="175" height="44" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="185" y="18" width="175" height="16" rx="3" fill="#3a4048"/>
    <text x="272" y="30" fill="#f5c400" font-size="9" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">Contactor 2</text>
    <text x="195" y="48" fill="#222" font-size="8" font-family="Arial,sans-serif">Circuit B · Poles 5-8</text>
    <text x="195" y="58" fill="#666" font-size="8" font-family="Arial,sans-serif">48A Full Load</text>
    <circle cx="350" cy="26" r="4" fill="#3aaa6e"/>

    <!-- Contactor 3 -->
    <rect x="0" y="66" width="175" height="44" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="0" y="66" width="175" height="16" rx="3" fill="#3a4048"/>
    <text x="87" y="78" fill="#f5c400" font-size="9" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">Contactor 3</text>
    <text x="10" y="96" fill="#222" font-size="8" font-family="Arial,sans-serif">Circuit C · Poles 9-12</text>
    <text x="10" y="106" fill="#666" font-size="8" font-family="Arial,sans-serif">48A Full Load</text>

    <!-- Contactor 4 -->
    <rect x="185" y="66" width="175" height="44" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="185" y="66" width="175" height="16" rx="3" fill="#3a4048"/>
    <text x="272" y="78" fill="#f5c400" font-size="9" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">Contactor 4</text>
    <text x="195" y="96" fill="#222" font-size="8" font-family="Arial,sans-serif">Circuit D · Poles 13-16</text>
    <text x="195" y="106" fill="#666" font-size="8" font-family="Arial,sans-serif">48A Full Load</text>
  </g>

  <!-- ===== 3. CONTROL TRANSFORMER + SPD ===== -->
  <g transform="translate(35, 254)">
    <text x="0" y="12" fill="#222" font-size="11" font-weight="700" font-family="Arial,sans-serif">3. CONTROL POWER + SURGE PROTECTION</text>

    <!-- Transformer -->
    <rect x="0" y="18" width="175" height="36" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="87" y="38" fill="#ff8844" font-size="10" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">Control Transformer</text>
    <text x="87" y="50" fill="#888" font-size="8" text-anchor="middle" font-family="Arial,sans-serif">277V → 24V  ·  Always ON</text>

    <!-- SPD -->
    <rect x="185" y="18" width="175" height="36" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="272" y="38" fill="#7ab8ff" font-size="10" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">Surge Protection (SPD)</text>
    <text x="272" y="50" fill="#888" font-size="8" text-anchor="middle" font-family="Arial,sans-serif">Use provided flexible conduit</text>
    <circle cx="350" cy="26" r="4" fill="#3aaa6e"/>
  </g>

  <!-- ===== 4. CIRCUIT BREAKERS ===== -->
  <g transform="translate(35, 310)">
    <text x="0" y="12" fill="#222" font-size="11" font-weight="700" font-family="Arial,sans-serif">4. CIRCUIT BREAKERS (per zone)</text>

    <rect x="0" y="18" width="75" height="30" rx="2" fill="#fff" stroke="#e05a2b" stroke-width="1.5"/>
    <text x="37" y="36" fill="#e05a2b" font-size="9" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">CB-A 50A</text>
    <rect x="80" y="18" width="75" height="30" rx="2" fill="#fff" stroke="#e05a2b" stroke-width="1.5"/>
    <text x="117" y="36" fill="#e05a2b" font-size="9" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">CB-B 50A</text>
    <rect x="160" y="18" width="75" height="30" rx="2" fill="#fff" stroke="#e05a2b" stroke-width="1.5"/>
    <text x="197" y="36" fill="#e05a2b" font-size="9" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">CB-C 50A</text>
    <rect x="240" y="18" width="75" height="30" rx="2" fill="#fff" stroke="#e05a2b" stroke-width="1.5"/>
    <text x="277" y="36" fill="#e05a2b" font-size="9" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">CB-D 50A</text>
  </g>

  <!-- ===== 5. CONTROL-LINK BOARD ===== -->
  <g transform="translate(35, 370)">
    <text x="0" y="12" fill="#222" font-size="11" font-weight="700" font-family="Arial,sans-serif">5. CONTROL-LINK BOARD</text>
    <rect x="0" y="18" width="370" height="30" rx="3" fill="#e0e8f0" stroke="#4a6a8a" stroke-width="2"/>
    <text x="185" y="36" fill="#2a4a6a" font-size="10" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif">Remote Monitoring & Control Interface</text>
  </g>

  <!-- ===== TERMINAL STRIPS ===== -->
  <g transform="translate(35, 424)">
    <rect x="0" y="0" width="160" height="18" rx="2" fill="#eee" stroke="#ccc" stroke-width="1"/>
    <text x="80" y="13" fill="#666" font-size="9" text-anchor="middle" font-family="Arial,sans-serif">Terminal strips: L1  N  G</text>
  </g>

  <!-- Bottom note -->
  <rect x="35" y="448" width="380" height="26" rx="3" fill="#fff8e0" stroke="#f5c400" stroke-width="1.5"/>
  <text x="225" y="465" fill="#665200" font-size="9" text-anchor="middle" font-family="Arial,sans-serif">⚠ Control system needs power 24/7 — install breaker lock-on device</text>

  <!-- Legend -->
  <g font-family="Arial,sans-serif" font-size="9" fill="#555">
    <rect x="35" y="480" width="8" height="8" fill="#e05a2b"/>
    <text x="48" y="488">Main/CB</text>
    <rect x="120" y="480" width="8" height="8" fill="#f5c400"/>
    <text x="133" y="488">Contactor</text>
    <rect x="220" y="480" width="8" height="8" fill="#ff8844"/>
    <text x="233" y="488">Control</text>
    <rect x="300" y="480" width="8" height="8" fill="#4a6a8a"/>
    <text x="313" y="488">Comms</text>
  </g>
</svg>
