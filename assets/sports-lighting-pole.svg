<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#151828"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a7a8a"/>
      <stop offset="50%" stop-color="#8a9aaa"/>
      <stop offset="100%" stop-color="#5a6a7a"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="50%" stop-color="#7a7a7a"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="eceBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#282e38"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3020"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="620" fill="url(#sky)"/>

  <!-- Ground line -->
  <rect x="0" y="430" width="400" height="190" fill="url(#ground)"/>
  <line x1="0" y1="430" x2="400" y2="430" stroke="#5a4a3a" stroke-width="2"/>

  <!-- Stars -->
  <circle cx="50" cy="30" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="55" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="320" cy="25" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="350" cy="60" r="0.7" fill="#fff" opacity="0.3"/>
  <circle cx="80" cy="80" r="0.6" fill="#fff" opacity="0.4"/>

  <!-- ============ LUMINAIRE ASSEMBLY ============ -->
  <g transform="translate(165, 35)">
    <!-- Crossarm -->
    <rect x="-55" y="0" width="110" height="8" rx="2" fill="url(#steel)" stroke="#4a5a6a" stroke-width="1"/>
    <!-- Fixtures -->
    <rect x="-45" y="-20" width="30" height="24" rx="3" fill="#2a3038" stroke="#5a6a7a" stroke-width="1.2"/>
    <text x="-30" y="-5" fill="#f5c400" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">LED</text>
    <rect x="15" y="-20" width="30" height="24" rx="3" fill="#2a3038" stroke="#5a6a7a" stroke-width="1.2"/>
    <text x="30" y="-5" fill="#f5c400" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">LED</text>
    <!-- Light beams -->
    <path d="M-30,4 L-60,60 L0,60 Z" fill="rgba(245,196,0,0.06)" stroke="rgba(245,196,0,0.15)" stroke-width="0.5"/>
    <path d="M30,4 L0,60 L60,60 Z" fill="rgba(245,196,0,0.06)" stroke="rgba(245,196,0,0.15)" stroke-width="0.5"/>
  </g>

  <!-- Pole top section -->
  <rect x="188" y="43" width="24" height="10" rx="2" fill="url(#steel)" stroke="#4a5a6a" stroke-width="1"/>

  <!-- ============ POLE (multi-segment) ============ -->
  <!-- Upper pole section -->
  <rect x="190" y="53" width="20" height="140" fill="url(#steel)" stroke="#4a5a6a" stroke-width="1"/>
  <!-- Weld joint -->
  <rect x="188" y="190" width="24" height="6" rx="2" fill="#5a6a7a" stroke="#4a5a6a" stroke-width="0.8"/>
  <!-- Mid pole section -->
  <rect x="190" y="196" width="20" height="80" fill="url(#steel)" stroke="#4a5a6a" stroke-width="1"/>

  <!-- ============ WIRE HARNESS (internal, dashed) ============ -->
  <line x1="200" y1="53" x2="200" y2="276" stroke="#f5c400" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="200" y1="53" x2="200" y2="276" stroke="#ff8844" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>

  <!-- ============ ECE ============ -->
  <g transform="translate(145, 276)">
    <rect x="0" y="0" width="110" height="66" rx="3" fill="url(#eceBox)" stroke="#5a6a7a" stroke-width="1.5"/>
    <!-- ECE interior components -->
    <rect x="6" y="6" width="44" height="22" rx="2" fill="#2a3038" stroke="#6a7a8a" stroke-width="0.8"/>
    <text x="28" y="19" fill="#7ab8ff" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">Driver 1</text>
    <rect x="56" y="6" width="44" height="22" rx="2" fill="#2a3038" stroke="#6a7a8a" stroke-width="0.8"/>
    <text x="78" y="19" fill="#7ab8ff" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">Driver 2</text>
    <rect x="6" y="32" width="44" height="22" rx="2" fill="#2a3038" stroke="#6a7a8a" stroke-width="0.8"/>
    <text x="28" y="45" fill="#7ab8ff" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">Driver 3</text>
    <rect x="56" y="32" width="44" height="22" rx="2" fill="#2a3038" stroke="#6a7a8a" stroke-width="0.8"/>
    <text x="78" y="45" fill="#7ab8ff" font-size="6" text-anchor="middle" font-family="Arial,sans-serif">Driver 4</text>
    <!-- Fuse blocks -->
    <rect x="96" y="52" width="10" height="10" rx="1" fill="#e05a2b" stroke="#a03a1b" stroke-width="0.5" opacity="0.8"/>
    <!-- Ground bar -->
    <rect x="2" y="60" width="14" height="4" rx="1" fill="#3aaa6e" stroke="#2a8a5e" stroke-width="0.5"/>
  </g>

  <!-- ECE mount bracket -->
  <rect x="180" y="310" width="40" height="8" rx="2" fill="#4a5a6a" stroke="#3a4a5a" stroke-width="1"/>
  <text x="200" y="316" fill="#f5c400" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">ECE ~10ft AFF</text>

  <!-- Lower pole section -->
  <rect x="190" y="318" width="20" height="90" fill="url(#steel)" stroke="#4a5a6a" stroke-width="1"/>
  <!-- Handhole -->
  <ellipse cx="200" cy="370" rx="8" ry="12" fill="#1a2028" stroke="#4a5a6a" stroke-width="1"/>

  <!-- ============ PRECAST BASE ============ -->
  <!-- Above ground -->
  <rect x="170" y="408" width="60" height="30" rx="3" fill="url(#concrete)" stroke="#3a3a3a" stroke-width="1.5"/>
  <!-- Below ground -->
  <rect x="160" y="438" width="80" height="90" rx="3" fill="url(#concrete)" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>
  <!-- Lightning ground rod -->
  <line x1="210" y1="438" x2="210" y2="540" stroke="#3aaa6e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="210" cy="540" r="3" fill="#3aaa6e"/>

  <!-- Underground conduit -->
  <rect x="145" y="460" width="12" height="50" rx="2" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="243" y="460" width="12" height="50" rx="2" fill="#333" stroke="#555" stroke-width="1"/>

  <!-- ============ LABELS ============ -->
  <!-- Label lines and text -->
  <g font-family="Arial,sans-serif" font-size="9" fill="#b0c4d8">
    <!-- 1. Luminaire -->
    <line x1="275" y1="38" x2="310" y2="38" stroke="#5a6a7a" stroke-width="0.8"/>
    <text x="313" y="41">1. Luminaire Assembly</text>

    <!-- 2. Wire Harness -->
    <line x1="275" y1="160" x2="310" y2="160" stroke="#5a6a7a" stroke-width="0.8"/>
    <text x="313" y="163">2. Wire Harness</text>

    <!-- 3. ECE -->
    <line x1="275" y1="310" x2="310" y2="310" stroke="#5a6a7a" stroke-width="0.8"/>
    <text x="313" y="313">3. ECE (Controls & Drivers)</text>

    <!-- 4. Steel Pole -->
    <line x1="275" y1="370" x2="310" y2="370" stroke="#5a6a7a" stroke-width="0.8"/>
    <text x="313" y="373">4. Steel Pole</text>

    <!-- 5. Base -->
    <line x1="240" y1="435" x2="310" y2="435" stroke="#5a6a7a" stroke-width="0.8"/>
    <text x="313" y="438">5. Precast Concrete Base</text>

    <!-- Lightning ground -->
    <line x1="225" y1="480" x2="310" y2="480" stroke="#3aaa6e" stroke-width="0.8"/>
    <text x="313" y="483" fill="#3aaa6e">Lightning Ground</text>

    <!-- Conduit -->
    <line x1="140" y1="490" x2="100" y2="490" stroke="#5a6a7a" stroke-width="0.8"/>
    <text x="8" y="493" fill="#7a8fa8">Underground</text>
    <text x="8" y="504" fill="#7a8fa8">Supply Conduit</text>
  </g>

  <!-- Title -->
  <text x="200" y="610" fill="#f5c400" font-size="11" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">Musco Pole System — 5 Components (tap to zoom)</text>
</svg>
