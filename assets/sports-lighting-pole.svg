<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" width="460" height="560">
  <rect width="460" height="560" fill="#f5f0e8"/>
  <!-- Title -->
  <text x="230" y="30" fill="#222" font-size="15" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">Pole System — 5 Components</text>

  <!-- Sky area -->
  <rect x="0" y="40" width="460" height="340" fill="#e8ecf0"/>

  <!-- Ground -->
  <rect x="0" y="380" width="460" height="180" fill="#c4b8a8"/>
  <line x1="0" y1="380" x2="460" y2="380" stroke="#8a7a6a" stroke-width="2"/>

  <!-- ===== 1. LUMINAIRE ASSEMBLY ===== -->
  <g transform="translate(220, 75)">
    <!-- Crossarm -->
    <rect x="-75" y="0" width="150" height="12" rx="2" fill="#8a9aaa" stroke="#5a6a7a" stroke-width="2"/>
    <text x="0" y="9" fill="#fff" font-size="9" text-anchor="middle" font-family="Arial,sans-serif">Crossarm</text>
    <!-- Fixtures -->
    <rect x="-65" y="-30" width="50" height="34" rx="4" fill="#3a4048" stroke="#1a2028" stroke-width="2"/>
    <text x="-40" y="-10" fill="#f5c400" font-size="10" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">LED</text>
    <rect x="15" y="-30" width="50" height="34" rx="4" fill="#3a4048" stroke="#1a2028" stroke-width="2"/>
    <text x="40" y="-10" fill="#f5c400" font-size="10" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">LED</text>
  </g>

  <!-- ===== 2. WIRE HARNESS ===== -->
  <g transform="translate(230, 125)">
    <!-- Dashed line showing harness inside pole -->
    <line x1="0" y1="0" x2="0" y2="120" stroke="#e05a2b" stroke-width="3" stroke-dasharray="6,4"/>
    <rect x="-18" y="50" width="36" height="14" rx="2" fill="#fff" stroke="#e05a2b" stroke-width="1.5"/>
    <text x="0" y="60" fill="#e05a2b" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">HARNESS</text>
  </g>

  <!-- ===== 3. ECE ===== -->
  <g transform="translate(230, 245)">
    <rect x="-55" y="0" width="110" height="50" rx="4" fill="#3a4048" stroke="#1a2028" stroke-width="2"/>
    <text x="0" y="20" fill="#f5c400" font-size="9" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">ECE</text>
    <text x="0" y="34" fill="#fff" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">Electrical Components</text>
    <text x="0" y="44" fill="#fff" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">Enclosure</text>
    <!-- Mount arrow -->
    <text x="80" y="30" fill="#555" font-size="8" font-family="Arial,sans-serif">Mounted ~10ft AFF</text>
  </g>

  <!-- ===== 4. STEEL POLE ===== -->
  <g transform="translate(223, 295)">
    <rect x="0" y="0" width="14" height="85" rx="1" fill="#8a9aaa" stroke="#5a6a7a" stroke-width="2"/>
    <text x="55" y="45" fill="#555" font-size="9" font-family="Arial,sans-serif">Multi-segment</text>
    <text x="55" y="58" fill="#555" font-size="9" font-family="Arial,sans-serif">steel pole</text>
    <text x="55" y="71" fill="#555" font-size="9" font-family="Arial,sans-serif">40–120+ ft</text>
  </g>

  <!-- ===== 5. PRECAST BASE ===== -->
  <g transform="translate(230, 380)">
    <rect x="-50" y="0" width="100" height="80" rx="3" fill="#9a9a9a" stroke="#6a6a6a" stroke-width="2"/>
    <!-- Underground portion -->
    <rect x="-50" y="30" width="100" height="50" rx="0" fill="#8a8a7a" stroke="#6a6a6a" stroke-width="1" opacity="0.7"/>
    <text x="0" y="20" fill="#fff" font-size="9" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">Precast Base</text>
    <text x="0" y="34" fill="#eee" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">Slip-fit concrete</text>
    <text x="0" y="44" fill="#eee" font-size="7" text-anchor="middle" font-family="Arial,sans-serif">3,000 psi min</text>
    <!-- Lightning ground rod -->
    <line x1="-20" y1="30" x2="-20" y2="70" stroke="#3aaa6e" stroke-width="3"/>
    <text x="-45" y="60" fill="#3aaa6e" font-size="7" font-family="Arial,sans-serif">Lightning</text>
    <text x="-45" y="70" fill="#3aaa6e" font-size="7" font-family="Arial,sans-serif">Ground</text>
    <!-- Conduit entry -->
    <rect x="30" y="40" width="14" height="40" rx="2" fill="#555" stroke="#333" stroke-width="1"/>
  </g>

  <!-- ===== NUMBERED LABELS ===== -->
  <g font-family="Arial,sans-serif" font-size="11" fill="#222">
    <circle cx="30" cy="60" r="11" fill="#f5c400" stroke="#a88800" stroke-width="1.5"/>
    <text x="30" y="64" fill="#111" font-size="12" text-anchor="middle" font-weight="700">1</text>
    <text x="50" y="64" fill="#333">Luminaire Assembly — factory-aimed LED fixtures</text>

    <circle cx="30" cy="130" r="11" fill="#f5c400" stroke="#a88800" stroke-width="1.5"/>
    <text x="30" y="134" fill="#111" font-size="12" text-anchor="middle" font-weight="700">2</text>
    <text x="50" y="134" fill="#333">Wire Harness — factory-built, connects ECE to luminaires</text>

    <circle cx="30" cy="270" r="11" fill="#f5c400" stroke="#a88800" stroke-width="1.5"/>
    <text x="30" y="274" fill="#111" font-size="12" text-anchor="middle" font-weight="700">3</text>
    <text x="50" y="274" fill="#333">ECE — drivers/ballasts, fuses, disconnect, Control-Link</text>

    <circle cx="30" cy="340" r="11" fill="#f5c400" stroke="#a88800" stroke-width="1.5"/>
    <text x="30" y="344" fill="#111" font-size="12" text-anchor="middle" font-weight="700">4</text>
    <text x="50" y="344" fill="#333">Steel Pole — multi-section, heights 40–120+ ft</text>

    <circle cx="30" cy="430" r="11" fill="#f5c400" stroke="#a88800" stroke-width="1.5"/>
    <text x="30" y="434" fill="#111" font-size="12" text-anchor="middle" font-weight="700">5</text>
    <text x="50" y="434" fill="#333">Precast Base — slip-fit, 3,000 psi concrete, integrated lightning ground</text>
  </g>

  <!-- Legend / Key -->
  <g transform="translate(230, 510)">
    <text x="0" y="0" fill="#222" font-size="11" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">Tap to zoom · All 5 pieces are factory-matched per pole ID</text>
    <text x="0" y="16" fill="#e05a2b" font-size="9" text-anchor="middle" font-family="Arial,sans-serif">⚠ Never mix components between poles</text>
  </g>
</svg>
